<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Meu Consultório</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="pagina-cadastro">

        <section class="painel-esquerdo">
            <a href="#" class="logo">
                <span class="logo-icone">✚</span>
                <span class="logo-texto">
                    <strong>meu</strong>consultório
                </span>
            </a>

            <div class="mensagem">
                <h1>Bem-vindo,</h1>
                <p>Seu consultório<br>
                   está a apenas<br>
                   um clique!</p>
            </div>

            <p class="descricao">
                Informe seus dados ao lado<br>
                e desfrute da melhor ferramenta<br>
                de gerenciamento de consultórios.
            </p>

            <span class="seta" aria-hidden="true">›</span>
        </section>

        <section class="painel-direito">
            <header class="cabecalho">
                <h2>Cadastro</h2>
                <p>Já tem uma conta? <a href="#">Entre aqui!</a></p>
            </header>

            <form action="#" method="post">

                <fieldset>
                    <legend>Dados Pessoais</legend>

                    <div class="grade-campos">
                        <div class="campo">
                            <label for="nome">Nome</label>
                            <input
                                type="text"
                                id="nome"
                                name="nome"
                                placeholder="Informe seu nome completo"
                                autocomplete="name"
                                required
                            >
                        </div>

                        <div class="campo">
                            <label for="cpf">CPF</label>
                            <input
                                type="text"
                                id="cpf"
                                name="cpf"
                                placeholder="Informe os números do seu CPF"
                                inputmode="numeric"
                                pattern="[0-15]{15}"
                                title="Informe os 11 números do CPF, sem pontos ou traços."
                                maxlength="15"
                                required
                            >
                        </div>

                        <div class="campo">
                            <label for="email">E-mail</label>
                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Informe o seu e-mail"
                                autocomplete="email"
                                required
                            >
                        </div>

                        <div class="campo">
                            <label for="senha">Senha</label>
                            <input
                                type="password"
                                id="senha"
                                name="senha"
                                placeholder="Mínimo de 8 caracteres"
                                minlength="8"
                                autocomplete="new-password"
                                required
                            >
                        </div>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Dados Profissionais</legend>

                    <div class="grade-campos">
                        <div class="campo">
                            <label for="conselho">Sigla do Conselho</label>
                            <select id="conselho" name="conselho" required>
                                <option value="">Selecione ou digite a sigla</option>
                                <option value="CRM">CRM</option>
                                <option value="CRO">CRO</option>
                                <option value="CRP">CRP</option>
                                <option value="COREN">COREN</option>
                                <option value="CREFITO">CREFITO</option>
                                <option value="CRN">CRN</option>
                                <option value="CRF">CRF</option>
                                <option value="CREFONO">CREFONO</option>
                                <option value="OUTRO">Outro</option>
                            </select>
                        </div>

                        <div class="campo">
                            <label for="uf">UF</label>
                            <select id="uf" name="uf" required>
                                <option value="">Selecione ou digite o estado</option>
                                <option value="AC">AC</option>
                                <option value="AL">AL</option>
                                <option value="AP">AP</option>
                                <option value="AM">AM</option>
                                <option value="BA">BA</option>
                                <option value="CE">CE</option>
                                <option value="DF">DF</option>
                                <option value="ES">ES</option>
                                <option value="GO">GO</option>
                                <option value="MA">MA</option>
                                <option value="MT">MT</option>
                                <option value="MS">MS</option>
                                <option value="MG">MG</option>
                                <option value="PA">PA</option>
                                <option value="PB">PB</option>
                                <option value="PR">PR</option>
                                <option value="PE">PE</option>
                                <option value="PI">PI</option>
                                <option value="RJ">RJ</option>
                                <option value="RN">RN</option>
                                <option value="RS">RS</option>
                                <option value="RO">RO</option>
                                <option value="RR">RR</option>
                                <option value="SC">SC</option>
                                <option value="SP">SP</option>
                                <option value="SE">SE</option>
                                <option value="TO">TO</option>
                            </select>
                        </div>

                        <div class="campo">
                            <label for="numero-conselho">
                                Número do Conselho
                            </label>
                            <input
                                type="text"
                                id="numero-conselho"
                                name="numero_conselho"
                                placeholder="Informe seu número do Conselho"
                                required
                            >
                        </div>

                        <div class="campo">
                            <label for="especialidade">Especialidade</label>
                            <input
                                type="text"
                                id="especialidade"
                                name="especialidade"
                                placeholder="Informe a sua especialidade"
                                required
                            >
                        </div>
                    </div>
                </fieldset>

                <button type="submit">Cadastrar</button>

            </form>
        </section>

    </main>

</body>
</html>
